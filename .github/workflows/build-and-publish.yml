name: Build & Publish Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cloud Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Inject Environment Variables
        run: |
          KEY="${{ secrets.GEMINI_API_KEY }}"
          if [ -z "$KEY" ]; then
            KEY="AIzaSyDummyKeyForBuild"
          fi
          echo "GEMINI_API_KEY=\"$KEY\"" > .env

      - name: Build APK with Gradle
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true"
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: Print Failure Log Summary
        if: failure()
        run: |
          echo "==================== BUILD FAILURE DETAILS ===================="
          if [ -f gradle-build.log ]; then
            tail -n 120 gradle-build.log
          fi
          echo "==============================================================="

      - name: Upload Build Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-logs
          path: |
            gradle-build.log
            app/build/reports/
            app/build/outputs/logs/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wii-to-do-app-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
